<title>Arkivi i të dhënave</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: ledger-style archive. Header stats, tabs, list + detail. Petrol blue accent, paper neutrals. */
:root{--bg:#f4f6f7;--card:#fff;--fg:#14232b;--mut:#5b6b73;--line:#d9e0e3;--acc:#0b5d7a;--accbg:#e2f0f5;--ok:#1d7a46;--warn:#a86400;--bad:#b3261e;--okbg:#e3f3ea;--warnbg:#fbefd9;--badbg:#fbe4e2;--mono:ui-monospace,"SF Mono",Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e171b;--card:#162228;--fg:#e6eef1;--mut:#92a5ad;--line:#2a3a42;--acc:#6cc1de;--accbg:#173340;--ok:#6fd39b;--warn:#f0b45a;--bad:#ff8f86;--okbg:#14301f;--warnbg:#38290f;--badbg:#3b1815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e171b;--card:#162228;--fg:#e6eef1;--mut:#92a5ad;--line:#2a3a42;--acc:#6cc1de;--accbg:#173340;--ok:#6fd39b;--warn:#f0b45a;--bad:#ff8f86;--okbg:#14301f;--warnbg:#38290f;--badbg:#3b1815;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 "Inter",system-ui,sans-serif;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.6rem;margin:0;text-wrap:balance}h2{font-size:1.05rem;margin:0}
.lead{color:var(--mut);margin:4px 0 0;max-width:62ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.st b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}.st span{color:var(--mut);font-size:.82rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=search]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ds{text-align:left;font:inherit;color:inherit;cursor:pointer;display:grid;gap:4px;width:100%}
.ds:hover{border-color:var(--acc)}
.pill{display:inline-block;font-size:.74rem;padding:1px 8px;border-radius:999px;background:var(--accbg);color:var(--acc);width:max-content}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.mut{color:var(--mut);font-size:.84rem}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--accbg);position:sticky;top:0;white-space:nowrap}
td{max-width:320px;overflow-wrap:anywhere}
.num{font-variant-numeric:tabular-nums}
.bars{display:grid;gap:4px;margin:8px 0}
.bar{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;font-size:.82rem}
.bar i{display:block;height:12px;border-radius:3px;background:var(--acc)}.bar i.f{background:repeating-linear-gradient(45deg,var(--acc) 0 4px,transparent 4px 8px);border:1px solid var(--acc)}
.log{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.log li{border-left:3px solid var(--acc);padding:2px 0 2px 10px}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:s}
.flow div{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card)}
.flow b{display:block}
</style>
<main>
<header><h1>Arkivi i të dhënave të Kosovës</h1>
<p class="lead">Çdo shifër ruhet me burim, periudhë, metodologji dhe historik ndryshimesh. Kjo është memoria e përhershme e Monitorit të Planit.</p></header>
<section class="stats" id="stats"></section>
<nav class="tabs" role="tablist" id="tabs"></nav>
<section id="view"></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY=new Date("2026-11-23");
const S={ind:[],src:[],datasets:[],series:[],changes:[],tab:"pasqyra",open:null,q:"",live:false};
const TABS=[["pasqyra","Pasqyra"],["seri","Treguesit"],["te","Të dhënat"],["ind","Të llogaritura"],["bur","Burimet"],["ndr","Ndryshimet"],["motor","Motori"]];
const days=d=>Math.round((TODAY-new Date(d))/864e5);
const fresh=d=>{const n=days(d);return n<=30?["ok","I freskët"]:n<=90?["warn","Për kontroll"]:["bad","I vjetruar"]};
function group(){
  S.series.forEach(se=>{
    const all=S.obs.filter(o=>o.s===se.id).sort((a,b)=>String(a.collected).localeCompare(b.collected)||a.seq-b.seq);
    const per=[];const by={};
    all.forEach(o=>{if(!by[o.p]){by[o.p]=[];per.push(o.p)}by[o.p].push(o)});
    se.pts=per.map(p=>{const v=by[p],cur=v[v.length-1];return {...cur,hist:v.slice(0,-1)}});
    se.nobs=all.length;
  });
}
async function jget(p){try{const r=await fetch(p);return r.ok?await r.json():null}catch(e){return null}}
async function load(){
  let db=null;try{db=await window.claude?.use("db")}catch(e){}
  if(db){
    try{
      const g=async c=>{const s=await db.collection(c).get();const o=[];s.forEach(d=>o.push({...d.data(),_id:d.id}));return o};
      const [a,b,c,ob,ind,so]=await Promise.all([g("datasets"),g("series"),g("changes"),g("observations"),g("indicators"),g("sources")]);S.ind=ind.map(x=>({...x,inputs:JSON.parse(x.inputs||"[]")}));S.src=so;S.obs=ob.map(x=>({...x,src:JSON.parse(x.src||"[]")}));
      if(a.length||b.length){
        S.datasets=a.map(x=>({...x,cols:JSON.parse(x.cols||"[]"),rows:JSON.parse(x.rows||"[]")}));
        S.series=b.map(x=>({...x,src:JSON.parse(x.src||"[]")}));
        S.changes=c;S.live=true;
      }
    }catch(e){}
  }
  if(!S.live){
    const man=await jget("data/manifest.json")||[];
    S.datasets=(await Promise.all(man.map(m=>jget("data/"+m.id+".json")))).filter(Boolean);
    S.series=await jget("data/series.json")||[];S.obs=await jget("data/observations.json")||[];S.ind=await jget("data/indicators.json")||[];S.src=await jget("data/sources.json")||[];
    S.changes=await jget("data/changes.json")||[];
  }
  group();S.changes.sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  draw();
}
function stats(){
  const pts=S.obs.length,rows=S.datasets.reduce((n,d)=>n+d.rows.length,0);
  const old=S.datasets.filter(d=>days(d.checked)>90).length;
  $("stats").innerHTML=[[S.datasets.length,"tabela"],[rows,"rreshta"],[S.series.length,"seri"],[S.ind.length,"tregues të llogaritur"],[S.src.length,"burime në katalog"],[pts,"vëzhgime me burim"],[old,"të vjetruara (>90 ditë)"]].map(x=>`<div class="st"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
}
function tabs(){$("tabs").innerHTML=TABS.map(t=>`<button role="tab" aria-selected="${S.tab===t[0]}" data-t="${t[0]}">${t[1]}</button>`).join("")}
function csv(d){const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';return [d.cols,...d.rows].map(r=>r.map(q).join(",")).join("\n")}
async function copy(txt,btn){try{await navigator.clipboard.writeText(txt);btn.textContent="U kopjua"}catch(e){const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");btn.textContent="U kopjua"}catch(_){btn.textContent="Kopjo dorazi"}t.remove()}}
function vPasqyra(){
  const th={};S.datasets.forEach(d=>(th[d.theme]=th[d.theme]||[]).push(d));
  const rows=S.datasets.slice().sort((a,b)=>days(b.checked)-days(a.checked));
  return `<div class="card"><h2>Shëndeti i të dhënave</h2><p class="mut">Kontrolli i fundit i çdo tabele. Çdo tabelë më e vjetër se 90 ditë shënohet si e vjetruar.</p>
  <div class="grid">${Object.entries(th).map(([k,v])=>`<div><b>${esc(k)}</b><div class="mut">${v.length} tabela, ${v.reduce((n,d)=>n+d.rows.length,0)} rreshta</div></div>`).join("")}</div></div>
  <div class="card"><h2>Si garantohet besueshmëria</h2><div class="flow">
  <div><b>Burimi</b><span class="mut">Çdo vlerë ka lidhje te dokumenti zyrtar.</span></div>
  <div><b>Periudha</b><span class="mut">Viti ose tremujori, me parashikimet të veçuara.</span></div>
  <div><b>Metodologjia</b><span class="mut">Shënohet sipas burimit.</span></div>
  <div><b>Gjurma</b><span class="mut">Kur një vlerë ndryshon, e vjetra mbetet në historik.</span></div></div></div>
  <div class="card"><h2>Ndryshimet e fundit</h2>${vLog(S.changes.slice(0,5))}</div>`;
}
function vLog(a){return a.length?`<ul class="log">${a.map(c=>`<li><b>${esc(c.target)}</b> <span class="pill">${esc(c.kind)}</span> <span class="mut">${esc(c.ts)}</span><div>${esc(c.summary)}</div></li>`).join("")}</ul>`:'<p class="mut">Ende pa ndryshime.</p>'}
function chart(s){
  const mx=Math.max(...s.pts.map(p=>Math.abs(p.v)),1);
  return `<div class="bars">${s.pts.map(p=>`<div class="bar"><span>${esc(p.p)}</span><i class="${p.f?"f":""}" style="width:${Math.max(2,Math.abs(p.v)/mx*100)}%"></i><b class="num">${p.v}${esc(s.unit&&s.unit.length<4?" "+s.unit:"")}</b></div>`).join("")}</div>`;
}
function vSeri(){
  const q=S.q.toLowerCase();
  const list=S.series.filter(s=>!q||(s.t+s.sec).toLowerCase().includes(q));
  return `<input type="search" id="q" placeholder="Kërko tregues (inflacion, pagë, PBB...)" value="${esc(S.q)}" aria-label="Kërko">`+
  list.map(s=>`<div class="card"><div class="row"><span class="pill">${esc(s.sec)}</span><span class="mut">kontrolluar ${esc(s.checked)}</span></div><h2>${esc(s.t)}</h2>${chart(s)}
  <div class="mut">Vijëzimi tregon parashikim. Njësia: ${esc(s.unit)}.${s.note?" "+esc(s.note):""}</div>
  <details><summary>Burimi, metodologjia, historiku</summary>
  <p><b>Burimi:</b> ${s.src.map(x=>x.u?`<a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)}</a>`:esc(x.k)).join("; ")}</p>
  <p class="mut">Çdo vlerë e re shtohet si regjistrim i ri. Vlerat e vjetra nuk fshihen.</p><p><b>Periudha:</b> ${esc(s.pts[0]?.p)} deri ${esc(s.pts[s.pts.length-1]?.p)}</p>
  <p><b>Metodologjia:</b> ${esc(s.method)}</p>
  <div class="tw"><table><tr><th>Periudha</th><th>Vlera e fundit</th><th>Lloji</th><th>Publikuar</th><th>Mbledhur</th><th>Regjistrime të mëparshme</th></tr>${s.pts.map(p=>`<tr><td>${esc(p.p)}</td><td class="num">${p.v}</td><td>${p.f?"parashikim":"vëzhguar"}</td><td>${esc(p.pub||"pa datë")}</td><td>${esc(p.collected)}</td><td>${p.hist.length?p.hist.map(r=>esc(r.v+" (mbledhur "+r.collected+")")).join(", "):"asnjë, regjistrim i vetëm"}</td></tr>`).join("")}</table></div></details></div>`).join("")||'<p class="mut">Asnjë rezultat.</p>';
}
function vTe(){
  const q=S.q.toLowerCase();
  if(S.open){const d=S.datasets.find(x=>x.id===S.open);if(d){const f=fresh(d.checked);return `<button class="btn" id="back">← Të gjitha tabelat</button>
  <div class="card"><div class="row"><span class="pill ${f[0]}">${f[1]}</span><span class="pill">${esc(d.theme)}</span></div><h2>${esc(d.title)}</h2><p class="mut">${esc(d.desc)}</p>
  <p class="mut">Burimi: ${esc(d.source)} · kontrolluar ${esc(d.checked)} · ${d.rows.length} rreshta</p>
  <div class="row"><button class="btn" id="cp">Kopjo si CSV</button></div></div>
  <div class="tw" style="max-height:60vh"><table><tr>${d.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>${d.rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`}}
  const list=S.datasets.filter(d=>!q||(d.title+d.theme+d.desc).toLowerCase().includes(q));
  return `<input type="search" id="q" placeholder="Kërko tabelë" value="${esc(S.q)}" aria-label="Kërko"><div class="grid">${list.map(d=>{const f=fresh(d.checked);return `<button class="card ds" data-o="${esc(d.id)}"><span class="pill ${f[0]}">${f[1]}</span><b>${esc(d.title)}</b><span class="mut">${esc(d.theme)} · ${d.rows.length} rreshta</span><span class="mut">${esc(d.desc)}</span></button>`}).join("")}</div>`;
}
function vInd(){
  return `<div class="card"><h2>Tregues të llogaritur</h2><p class="mut">Këto shifra nuk i publikon burimi. I llogarit arkivi nga vëzhgimet, me formulë të hapur dhe hyrje të listuara. Nëse vëzhgimi ndryshon, vlera rillogaritet si regjistrim i ri.</p></div>`+
  S.ind.map(i=>`<div class="card"><div class="row"><span class="pill">i llogaritur</span><span class="mut">llogaritur ${esc(i.computed)}</span></div><h2>${esc(i.title)}</h2>
  <div style="font-size:1.8rem;font-weight:700" class="num">${i.value} <span class="mut" style="font-size:.9rem;font-weight:400">${esc(i.unit)}</span></div>
  <details><summary>Formula dhe hyrjet</summary><p><b>Formula:</b> ${esc(i.formula)}</p>
  <div class="tw"><table><tr><th>Seria</th><th>Periudha</th><th>Vlera</th><th>Vëzhgimi</th></tr>${i.inputs.map(x=>`<tr><td>${esc(x.s)}</td><td>${esc(x.p)}</td><td class="num">${x.v}</td><td>${esc(x.obs)}</td></tr>`).join("")}</table></div>
  <p class="mut">${esc(i.note)}</p></details></div>`).join("");
}
function vBur(){
  const q=S.q.toLowerCase();const l=S.src.filter(x=>!q||(x.inst+x.title+x.type).toLowerCase().includes(q));
  return `<input type="search" id="q" placeholder="Kërko burim (BQK, ASK, IMF...)" value="${esc(S.q)}" aria-label="Kërko"><div class="tw"><table><tr><th>Institucioni</th><th>Lloji</th><th>Dokumenti</th><th>Seri</th><th>Kontrolluar</th></tr>${l.map(x=>`<tr><td>${esc(x.inst)}</td><td>${esc(x.type)}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></td><td class="num">${x.series}</td><td>${esc(x.checked)}</td></tr>`).join("")}</table></div>`;
}
function vMotor(){return `<div class="card"><h2>Motori i mbledhjes automatike</h2><p class="mut">Hapat që ndjek çdo cikël. Motori ekzekutohet jashtë kësaj faqeje dhe shkruan rezultatin në këtë arkiv.</p>
<div class="flow"><div><b>1. Burimet</b><span class="mut">Regjistri i burimeve zyrtare (BQK, ASK, MF, Qeveria, KE).</span></div><div><b>2. Leximi</b><span class="mut">Shkarkon PDF, Excel dhe faqe, nxjerr tabelat.</span></div><div><b>3. Treguesit</b><span class="mut">Nxjerr vlerën, periudhën dhe njësinë.</span></div><div><b>4. Krahasimi</b><span class="mut">Krahason me periudhën e mëparshme dhe me vlerën e ruajtur.</span></div><div><b>5. Versioni</b><span class="mut">Ruan versionin e ri dhe shënon ndryshimin.</span></div><div><b>6. Shqyrtimi</b><span class="mut">Ndryshimet e mëdha presin miratim njerëzor.</span></div></div></div>
<div class="card"><h2>Gjendja tani</h2><p class="mut">Përditësimet bëhen me kërkesë: Claude lexon burimin zyrtar, shkruan vlerën e re dhe hedh një shënim te Ndryshimet. Mbledhja plotësisht automatike kërkon një server ose një plan të paguar për detyra të planifikuara.</p></div>`}
function draw(){
  stats();tabs();
  $("view").innerHTML=`<div style="display:grid;gap:12px">${({pasqyra:vPasqyra,seri:vSeri,te:vTe,ind:vInd,bur:vBur,ndr:()=>`<div class="card"><h2>Historiku i ndryshimeve</h2>${vLog(S.changes)}</div>`,motor:vMotor})[S.tab]()}</div>`;
  const q=$("q");if(q)q.oninput=e=>{S.q=e.target.value;const p=e.target.selectionStart;draw();const n=$("q");n.focus();n.setSelectionRange(p,p)};
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t]");if(t){S.tab=t.dataset.t;S.open=null;S.q="";draw();return}
  const o=e.target.closest("[data-o]");if(o){S.open=o.dataset.o;draw();return}
  if(e.target.id==="back"){S.open=null;draw()}
  if(e.target.id==="cp"){copy(csv(S.datasets.find(x=>x.id===S.open)),e.target)}
});
load();
</script>
