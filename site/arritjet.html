<!doctype html><html lang="sq"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><!--PROVË: hiqe noindex më 15 dhjetor--><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pohimet e Qeverisë</title>
<style>
:root{--bg:#eef3fb;--c:#fff;--t:#0b2a5b;--m:#5b6b86;--b:#1e4fa3;--y:#f5b800;--g:#1a9b5a;--r:#d23b3b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:16px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--m);font-size:13px;margin-bottom:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:0;border-radius:20px;padding:7px 12px;background:#fff;color:var(--t);font-weight:600}.tabs button.on{background:var(--b);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--c);border-radius:16px;padding:14px;border-top:4px solid var(--y)}
.card h3{margin:0 0 8px;font-size:14px}.row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:var(--m)}
.row i{display:block;height:14px;border-radius:7px;min-width:4px}.row b{color:var(--t);font-size:14px;white-space:nowrap}
.q{background:var(--b)}.i{background:var(--g)}.lab{width:58px;flex:none}
.tag{font-size:11px;color:var(--m);margin-top:6px}.ok{color:var(--g);font-weight:700}.no{color:var(--r);font-weight:700}
</style></head><body>
<h1>📈 Pohimet e Qeverisë · para dhe tani</h1>
<div class="sub">Vetëvlerësim i Kryeministrisë (blu) krahasuar me të dhënat e arkivit (jeshile) ku ka.</div>
<div class="tabs" id="tb"></div><div class="grid" id="g"></div>
<div class="tag" style="margin-top:14px">Burimi: Zyra e Kryeministrit (vetëvlerësim) · krahasim: ASK, arkivi i të dhënave. Pa verifikim të pavarur për treguesit pa shirit jeshil.</div>
<script>
const ICO={ekonomia:'💶',shendetesia:'🏥',social:'👪',siguri:'🛡️',"pushteti-lokal":'🏘️',digjitale:'💻',renditje:'🏆',"ndërkombëtare":'🇪🇺'};
const MAP={'paga-bruto':'punesimi-0','paga-neto':'punesimi-1','papunesia':'punesimi-3'};
let A,O={},cur='te gjitha';
const num=v=>typeof v==='number'?v:null;
const fmt=v=>v==null?'–':(typeof v==='number'?v.toLocaleString('sq'):v);
function ind(id){const l=(O[id]||[]).sort((a,b)=>(a.collected||'').localeCompare(b.collected||'')||(a.seq||0)-(b.seq||0));return l.length?l[l.length-1]:null}
function draw(){
 const secs=['te gjitha',...new Set(A.tregues.map(t=>t.sek))];
 tb.innerHTML=secs.map(s=>`<button class="${s==cur?'on':''}" onclick="cur='${s}';draw()">${ICO[s]||'📊'} ${s}</button>`).join('');
 g.innerHTML=A.tregues.filter(t=>cur=='te gjitha'||t.sek==cur).map(t=>{
  const a=num(t.nga),b=num(t.deri),m=Math.max(a||0,b||0)||1,o=MAP[t.id]?ind(MAP[t.id]):null;
  const bar=(l,v,c)=>`<div class="row"><span class="lab">${l}</span><i class="${c}" style="width:${v==null?0:Math.max(4,v/m*55)}%"></i><b>${fmt(v)}</b></div>`;
  let h=`<div class="card"><h3>${ICO[t.sek]||'📊'} ${t.t}</h3>`;
  h+=bar('Para',a??t.nga,'q')+bar('Tani',b??t.deri,'q');
  if(o){h+=bar('Arkivi',o.v,'i');h+=`<div class="tag">Arkivi: ${o.p}</div>`}
  h+=`<div class="tag">${t.njesia||''} · ${t.periudha}${t.shenim?' · '+t.shenim:''}</div></div>`;return h}).join('')}
Promise.all([fetch('../data/qeveria-arritjet.json').then(r=>r.json()),fetch('../data/observations.json').then(r=>r.json())]).then(([a,o])=>{A=a;(o.observations||o).forEach(x=>(O[x.s]=O[x.s]||[]).push(x));draw()}).catch(()=>{g.innerHTML='<div class="card">Hapeni përmes faqes së publikuar (jo file://).</div>'});
</script></body></html>
