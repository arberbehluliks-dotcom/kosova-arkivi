name: Përditëso të dhënat
on:
  schedule: [{cron: "0 5 * * 1"}]   # çdo të hënë në 05:00 UTC
  workflow_dispatch: {}
  push:
    paths: ["motor/**", ".github/workflows/**"]
permissions: {contents: write}
concurrency: {group: motor, cancel-in-progress: false}
jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pdfplumber
      - name: Prova pa rrjet
        run: cd motor && python test_motor.py 2>&1 | tee ../data/motor.log
      - name: Motori
        continue-on-error: true
        run: cd motor && python motor.py --arkivi ../data --dalja ../data/ndryshime.json --apliko 2>&1 | tee -a ../data/motor.log
      - name: Ruaj rezultatin
        run: |
          git config user.name "motori"; git config user.email "motori@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -m "Përditësim automatik $(date -I)"; git pull --rebase -q; git push
